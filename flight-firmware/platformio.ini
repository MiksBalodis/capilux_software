[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
test_ignore = *

; host-side tests for the command parser: pio test -e native
[env:native]
platform = native
build_flags = -I src
test_build_src = no

